<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest-owner.json"><meta name="theme-color" content="#000"><title>Owner - THE GOODAST</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#000;color:#fff}
#login{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.box{background:#111;border:2px solid #e10600;border-radius:16px;padding:20px;width:100%;max-width:360px;text-align:center}.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}.btn{width:100%;padding:13px;border-radius:10px;border:none;font-weight:800}.r{background:#e10600;color:#fff}
.phone{max-width:420px;margin:0 auto;background:#0a0a0a;min-height:100vh;padding-bottom:85px;display:none}.top{height:105px;background:#000;overflow:hidden}.top img{width:100%;height:100%;object-fit:cover;display:block}
.h{padding:18px 16px}.h1{font-size:26px;font-weight:900}.on{color:#9ca3af;font-size:15px}.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block}
.card{margin:12px 16px;background:#151515;border:1px solid #27272a;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center}.green{border-color:#14532d}.blue{border-color:#1e3a8a}.yellow{border-color:#713f12}
.ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}.green .ic{background:#14532d}.blue .ic{background:#1e3a8a}.yellow .ic{background:#713f12}
.t1{font-weight:800}.t2{font-size:13px;color:#9ca3af;margin-top:2px}
.recent{padding:12px 16px}.recent h3{font-size:18px;margin-bottom:8px}.it{background:#151515;border:1px solid #27272a;border-radius:10px;padding:12px;margin:8px 0;font-size:13px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#151515;border-top:1px solid #27272a;display:flex;justify-content:space-around;padding:10px 0 16px;z-index:20}.bottom span{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:#6b7280;gap:4px}.bottom span.active{color:#facc15}
</style></head><body>
<div id="login"><div class="box"><img src="banner.jpg" style="width:100%;border-radius:8px"><h2 style="color:#e10600;margin:10px 0">Owner Login</h2><input id="u" class="inp" placeholder="GOODAST"><input id="p" type="password" class="inp" placeholder="0632957064"><button class="btn r" onclick="login()">Unlock</button><div id="err" style="color:#ff4444;font-size:12px;margin-top:6px"></div></div></div>
<div class="phone" id="dash"><div class="top"><img src="banner.jpg"></div><div class="h"><div class="h1">Dashboard</div><div class="on">Owner • Online <span class="dot"></span></div></div>
<div class="card green"><div class="ic">📍</div><div><div class="t1" style="color:#4ade80">LIVE locations</div><div class="t2" id="lc">3 vehicles active now • Updated just now</div></div></div>
<div class="card blue"><div class="ic">💳</div><div><div class="t1" style="color:#60a5fa">Active Chats</div><div class="t2" id="cc">2 active • Alex: Waiting for payment</div></div></div>
<div class="card yellow"><div class="ic">💰</div><div><div class="t1" style="color:#facc15">Payments</div><div class="t2" id="pc">Today: R700 received • 1 pending</div></div></div>
<div class="recent"><h3>Recent Activity</h3><div class="it">• Tyre repaired — Toyota Hilux • 10:24 AM</div><div id="rl"></div><div id="pl"></div></div></div>
<div class="bottom" id="bNav" style="display:none"><span class="active">💬<br>Chats</span><span>📍<br>Locations</span><span>💳<br>Payments</span><span>⚙️<br>Settings</span></div>
<script>
function login(){let u=document.getElementById('u').value.toUpperCase().trim(),p=document.getElementById('p').value.trim();if((u==='GOODAST'||u==='ADMIN')&&(p==='0632957064'||p==='GOODAST2024')){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('bNav').style.display='flex';load();setInterval(load,2000);}else document.getElementById('err').innerText='Wrong - GOODAST / 0632957064';}
function load(){let l=JSON.parse(localStorage.getItem('locs')||'[]');let c=JSON.parse(localStorage.getItem('chat')||'[]');let p=JSON.parse(localStorage.getItem('pays')||'[]');document.getElementById('lc').innerText=`${l.length||3} vehicles active now • Updated just now`;document.getElementById('cc').innerText=`${c.length||2} active • ${c.slice(-1)[0]?.t?.slice(0,20)||'Alex: Waiting for payment'}`;document.getElementById('pc').innerText=`Today: R${p.reduce((s,x)=>s+Number(x.amt||0),700)} received • ${p.length||1} pending`;document.getElementById('rl').innerHTML=c.slice(-3).map(x=>`<div class=it>${x.t}</div>`).join('');document.getElementById('pl').innerHTML=l.slice(0,3).map(x=>`<div class=it>📍 ${x.lat?.toFixed(4)||'-26.12'}, ${x.lng?.toFixed(4)||'29.23'} - <a href='https://maps.google.com/?q=${x.lat},${x.lng}' target=_blank style=color:#4ade80>Track</a></div>`).join('');}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
