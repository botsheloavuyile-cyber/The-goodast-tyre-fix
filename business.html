<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest-owner.json"><meta name="theme-color" content="#e10600">
<title>THE GOODAST TYRE FIX - Owner App</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#0a0a0a;color:#fff}
#login{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}#login.box{background:#151515;border:2px solid #e10600;border-radius:18px;padding:22px;max-width:380px;width:100%;text-align:center}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;cursor:pointer;margin:6px 0;color:#fff}.r{background:#e10600}.d{background:#222}
.top{position:sticky;top:0;z-index:10;background:#e10600;height:75px;display:flex;align-items:center;padding:0;overflow:hidden;border-bottom:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}.top img{width:100%;height:100%;object-fit:cover;background:#fff}.top.txt{position:absolute;left:12px;bottom:8px;background:rgba(0,0,0,.85);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:800;color:#fff}
#dash{display:none;max-width:520px;margin:0 auto;padding-bottom:180px}
.card{background:#151515;border:1px solid #222;border-radius:14px;padding:12px;margin:12px}.card.red{border-color:#e10600}
.chat-list{display:flex;flex-direction:column;gap:8px}.chat-cust{padding:12px;background:#0a0a0a;border-radius:10px;border:1px solid #222;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.chat-cust.active{border-color:#e10600;background:#1a0a0a}
.chat-wrap{border:2px solid #e10600;border-radius:14px;overflow:hidden;margin-top:12px}.chat-head{background:#222;padding:10px;display:flex;align-items:center;gap:8px}.chat-box{height:300px;overflow-y:auto;padding:12px;background:#000;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:75%;padding:10px 12px;border-radius:14px;font-size:13px}.from-customer{align-self:flex-start;background:#222;border:1px solid #333}.from-owner{align-self:flex-end;background:#e10600;color:#fff}.time{font-size:10px;opacity:.7;margin-top:4px}
.chat-input{display:flex;gap:6px;padding:10px;background:#111;border-top:1px solid #222}.chat-input input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#000;color:#fff}.chat-input button{padding:12px 16px;border-radius:20px;border:none;background:#e10600;color:#fff;font-weight:800;cursor:pointer}
.live{width:10px;height:10px;background:#16a34a;border-radius:50%;display:inline-block;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#111;border-top:3px solid #e10600;display:flex;justify-content:space-around;padding:10px 0 16px 0;z-index:100;min-height:78px;box-shadow:0 -2px 15px rgba(0,0,0,.5)}.bottom button{background:#222;border:1px solid #333;border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;cursor:pointer;color:#fff;min-width:60px}.bottom button.active{background:#e10600;color:#fff;border-color:#e10600}
</style></head><body>
<div id="login"><div class="box"><img src="banner.jpg" style="width:85%;max-width:280px;margin-bottom:12px;border-radius:10px;border:2px solid #e10600;background:#fff"><h2 style="color:#e10600">Owner App</h2><p style="color:#aaa;font-size:13px">Red & White Banner - Chat Platform</p><p style="font-size:11px;color:#16a34a"><span class="live"></span> Communication Active</p><input id="u" class="inp" placeholder="Username: GOODAST"><input id="p" type="password" class="inp" placeholder="Password: 0632957064"><button class="btn r" onclick="doLogin()">🔓 Login</button><a href="index.html" class="btn d" style="display:block;text-decoration:none;text-align:center">← Customer App</a><div id="err" style="color:#ff4444;font-size:12px;margin-top:8px"></div></div></div>
<div id="dash"><div class="top"><img src="banner.jpg" alt="Banner"><div class="txt"><span class="live"></span> Owner App - Chat Platform</div></div><div class="card"><b>💬 Customer Chats LIVE - Works Together</b><br><small style="color:#aaa">Customer ↔ Owner share storage, instant messages. RED & WHITE theme.</small></div><div class="card red"><b>📍 LIVE Locations</b><div id="locList"></div></div><div class="card"><b>👥 Active Chats</b><div id="custList" class="chat-list"></div></div><div id="chatArea" class="card" style="display:none"><div class="chat-wrap"><div class="chat-head"><span class="live"></span><b id="chatWith">Customer</b></div><div id="chatBox" class="chat-box"></div><div class="chat-input"><input id="msgInput" placeholder="Reply..."><button onclick="sendOwnerMsg()">Send</button></div></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn d" style="flex:1" onclick="sendQuick('On my way! 🚗')">📍 On my way!</button><button class="btn d" style="flex:1" onclick="sendQuick('Payment received ✅ Thank you!')">✅ Payment OK</button></div></div><div class="card"><b>💳 Payments</b><div id="payList"></div></div></div><div class="bottom" id="bNav" style="display:none"><button class="active">💬<br>Chats</button><button>📍<br>Locations</button><button>💳<br>Payments</button><button>⚙️<br>Settings</button></div><script>
let selectedCustomer=null;
function doLogin(){let u=document.getElementById('u').value.toUpperCase().trim(),p=document.getElementById('p').value.trim();if(['GOODAST','ADMIN','OWNER'].includes(u)&&['0632957064','GOODAST2024'].includes(p)){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('bNav').style.display='flex';loadAll();setInterval(loadAll,2000);}else document.getElementById('err').innerText='Wrong - Use GOODAST / 0632957064';}
function loadAll(){loadLocs();loadPays();loadCustomers();if(selectedCustomer)loadChat();}
function loadLocs(){let arr=JSON.parse(localStorage.getItem('locs')||'[]');let el=document.getElementById('locList');if(!arr.length){el.innerHTML='<small style=color:#666>No location yet</small>';return;}el.innerHTML=arr.slice(0,5).map(x=>`<div style="padding:8px;border-bottom:1px solid #222"><small>${x.t}<br><a href="https://maps.google.com/?q=${x.lat},${x.lng}" target="_blank" style="color:#25D366">📍 ${x.lat.toFixed(4)}, ${x.lng.toFixed(4)} - TRACK</a></small></div>`).join('');}
function loadPays(){let arr=JSON.parse(localStorage.getItem('pays')||'[]');let el=document.getElementById('payList');if(!arr.length){el.innerHTML='<small style=color:#666>No payments</small>';return;}el.innerHTML=arr.map(x=>`<div style="padding:8px;border-bottom:1px solid #222"><b>R${x.amt}</b> - ${x.srv||''}<br><small>${x.t}</small></div>`).join('');}
function loadCustomers(){let msgs=JSON.parse(localStorage.getItem('chatMessages')||'[]');let ids=[...new Set(msgs.map(m=>m.customerId))];let el=document.getElementById('custList');if(!ids.length){el.innerHTML='<small style=color:#666>No chats yet</small>';return;}el.innerHTML=ids.map(id=>{let last=msgs.filter(m=>m.customerId===id).slice(-1)[0];let count=msgs.filter(m=>m.customerId===id&&m.from==='customer').length;return `<div class="chat-cust ${selectedCustomer===id?'active':''}" onclick="openChat('${id}')"><div><b>Customer ${id.slice(-4)}</b><br><small style="color:#aaa">${last?last.text.slice(0,25):''}...</small></div><div><span style="background:#e10600;padding:2px 8px;border-radius:10px;font-size:11px">${count}</span></div></div>`;}).join('');}
function openChat(id){selectedCustomer=id;document.getElementById('chatArea').style.display='block';document.getElementById('chatWith').innerText='Customer '+id.slice(-4);loadChat();}
function loadChat(){if(!selectedCustomer)return;let msgs=JSON.parse(localStorage.getItem('chatMessages')||'[]').filter(m=>m.customerId===selectedCustomer);let box=document.getElementById('chatBox');box.innerHTML=msgs.map(m=>`<div class="bubble ${m.from==='customer'?'from-customer':'from-owner'}">${m.text}<div class="time">${m.from==='customer'?'Customer':'You'} • ${m.time}</div></div>`).join('');box.scrollTop=box.scrollHeight;}
function sendOwnerMsg(){let input=document.getElementById('msgInput');let text=input.value.trim();if(!text||!selectedCustomer)return;let msgs=JSON.parse(localStorage.getItem('chatMessages')||'[]');msgs.push({from:'owner',text:text,time:new Date().toLocaleTimeString().slice(0,5),customerId:selectedCustomer,t:Date.now()});localStorage.setItem('chatMessages',JSON.stringify(msgs.slice(-100)));input.value='';loadChat();loadCustomers();}
function sendQuick(t){document.getElementById('msgInput').value=t;sendOwnerMsg();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script></body></html>
